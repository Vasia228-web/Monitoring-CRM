<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Вхід — Нерухомість Івано-Франківська</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#1d2330;--muted:#6b7080;--line:#e2e0da;
  --accent:#2c5fd6;--bad:#b3261e;--bad-bg:#fbeae8}
@media (prefers-color-scheme: dark){:root{--bg:#15171c;--card:#1d2028;--ink:#e8eaf0;
  --muted:#9aa0ad;--line:#2d313b;--accent:#7ea2ff;--bad:#ff8a80;--bad-bg:#3a1f1d}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);
  color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding:20px}
.card{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);
  border-radius:14px;padding:28px 26px}
h1{font-size:19px;margin:0 0 4px}
.sub{color:var(--muted);font-size:14px;margin:0 0 22px}
label{display:block;font-size:13.5px;font-weight:600;margin:0 0 6px}
input{width:100%;font:inherit;padding:11px 12px;border:1px solid var(--line);border-radius:9px;
  background:var(--bg);color:var(--ink);margin:0 0 16px}
input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
button{width:100%;font:inherit;font-weight:600;padding:12px;border:0;border-radius:9px;
  background:var(--accent);color:#fff;cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
.error{background:var(--bad-bg);color:var(--bad);border-radius:9px;padding:10px 12px;
  font-size:14.5px;margin:0 0 18px}
</style>
</head>
<body>
<main class="card">
  <h1>Нерухомість Івано-Франківська</h1>
  <p class="sub">Увійдіть, щоб переглянути моніторинг.</p>
  {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/login">
    <input type="hidden" name="next" value="{{ next }}">
    <label for="username">Логін</label>
    {# Телефонна клавіатура не має ні робити першу літеру великою, ні
       «виправляти» логін — саме це ламало вхід через браузерне віконце. #}
    <input id="username" name="username" value="{{ user }}" required
           autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false"
           {% if not user %}autofocus{% endif %}>
    <label for="password">Пароль</label>
    <input id="password" name="password" type="password" required
           autocomplete="current-password" {% if user %}autofocus{% endif %}>
    <button type="submit" {% if blocked %}disabled{% endif %}>Увійти</button>
  </form>
</main>
</body>
</html>
