<script>
  // Селекти застосовуються одразу; ціна — лише кнопкою «Застосувати» або Enter,
  // інакше список смикається на кожну введену цифру.
  var form = document.querySelector('form.filters');
  document.querySelectorAll('.filters [data-auto]').forEach(function (el) {
    el.addEventListener('change', function () { form.requestSubmit(); });
  });
  form?.querySelectorAll('input[type=number]').forEach(function (el) {
    el.addEventListener('keydown', function (ev) {
      if (ev.key === 'Enter') { ev.preventDefault(); form.requestSubmit(); }
    });
  });
  // Порожні поля не потрапляють в адресу — так посилання лишається читабельним
  // і його можна передати іншій людині.
  form?.addEventListener('submit', function () {
    form.querySelectorAll('select, input').forEach(function (el) {
      if (el.type !== 'radio' && el.value === '') el.disabled = true;
    });
    setTimeout(function () {
      form.querySelectorAll('[disabled]').forEach(function (el) { el.disabled = false; });
    }, 0);
  });

  // «Взято в обробку»: статус зберігається в базі, тож переживає перезапуск
  // і видно його з будь-якого пристрою.
  document.addEventListener('click', function (ev) {
    var btn = ev.target.closest('button.take');
    if (!btn) return;
    var next = btn.dataset.taken !== '1';
    // На сторінці об'єкта кнопка одна й діє на всі склеєні оголошення,
    // у списку — на конкретне оголошення в рядку.
    var url = btn.dataset.property
      ? '/api/properties/' + btn.dataset.property + '/processing'
      : '/api/listings/' + btn.dataset.id + '/processing';
    btn.disabled = true;
    fetch(url, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({in_progress: next}),
    }).then(function (r) { return r.json(); }).then(function (d) {
      if (!d.ok) throw new Error(d.error || 'не вдалося');
      var row = btn.closest('tr');
      if (document.body.dataset.page === 'processing' && !d.in_progress && row) {
        row.remove();                   // на сторінці обробки об'єкту вже не місце
        return;
      }
      btn.dataset.taken = d.in_progress ? '1' : '0';
      btn.classList.toggle('on', d.in_progress);
      btn.textContent = btn.dataset.property
        ? (d.in_progress ? 'В обробці — прибрати' : 'Взяти в обробку')
        : (d.in_progress ? 'В обробці' : 'Взяти');
      if (row) row.classList.toggle('taken', d.in_progress);
    }).catch(function (e) {
      btn.textContent = 'помилка';
      console.error(e);
    }).finally(function () { btn.disabled = false; });
  });
</script>
