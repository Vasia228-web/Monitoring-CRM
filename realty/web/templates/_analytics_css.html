<style>
.sect{margin:38px 0 0}
.sect > h2{font-size:18px;font-weight:600;letter-spacing:-.015em;margin:0 0 4px}
.sect > .cap{font-size:12.5px;color:var(--muted);margin:0 0 16px;max-width:78ch;line-height:1.6}
.sect > .cap b{color:var(--ink-2);font-weight:550}

/* картка «недостатньо даних» — штатний елемент, а не помилка */
.gap{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:20px 22px;box-shadow:var(--shadow)}
.gap .badge{display:inline-block;font-size:11px;letter-spacing:.05em;text-transform:uppercase;
  color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 9px;
  margin-bottom:10px}
.gap p{margin:0 0 10px;font-size:14px;color:var(--ink-2);line-height:1.6;max-width:76ch}
.gap p:last-child{margin-bottom:0}
.gap .num{font-weight:600;color:var(--ink)}

/* смуга: медіана в межах міжквартильного розмаху */
.bars{display:grid;gap:2px}
.bar{display:grid;grid-template-columns:minmax(150px,26%) 1fr minmax(96px,auto);
  gap:14px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line-2)}
.bar:last-child{border-bottom:0}
.bar .name{font-size:13.5px;color:var(--ink-2);line-height:1.35}
.bar .name b{display:block;color:var(--ink);font-weight:560}
.bar .track{position:relative;height:22px;background:var(--line-2);border-radius:5px}
.bar .iqr{position:absolute;top:0;bottom:0;background:var(--accent-soft);border-radius:5px}
.bar .med{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--accent);border-radius:2px}
.bar .val{text-align:right;font-size:14px;font-weight:580;white-space:nowrap}
.bar .val small{display:block;font-size:11px;font-weight:400;color:var(--muted);margin-top:1px}

/* пара новобудова / вторинка */
.pairs{display:grid;grid-template-columns:repeat(auto-fit,minmax(268px,1fr));gap:12px}
.pair{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:15px 17px;box-shadow:var(--shadow)}
.pair h3{margin:0 0 12px;font-size:13.5px;font-weight:560;color:var(--ink-2)}
.pair .row{display:flex;justify-content:space-between;align-items:baseline;
  padding:5px 0;font-size:14px}
.pair .row span{color:var(--muted);font-size:12.5px}
.pair .row b{font-weight:600}
.pair .gapv{margin-top:10px;padding-top:10px;border-top:1px solid var(--line-2);
  font-size:12.5px;color:var(--ink-2)}
.pair .gapv b{color:var(--warn)}

/* матриця джерел */
.grid{width:100%;border-collapse:collapse;font-size:13.5px;min-width:620px}
.grid th{font-size:11px;font-weight:520;letter-spacing:.05em;text-transform:uppercase;
  color:var(--muted);text-align:right;padding:0 10px 8px;border-bottom:1px solid var(--line)}
.grid th:first-child{text-align:left}
.grid td{padding:10px;border-bottom:1px solid var(--line-2);text-align:right;white-space:nowrap}
.grid td:first-child{text-align:left;color:var(--ink-2)}
.grid td small{display:block;font-size:11px;color:var(--muted);font-weight:400}
.grid td.best b{color:var(--ok)}
.grid tbody tr:hover td{background:var(--card)}

/* заголовок сторінки об'єкта */
.verdict{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:24px 26px;box-shadow:var(--shadow);margin-bottom:8px}
.verdict .big{font-size:34px;font-weight:660;letter-spacing:-.028em;line-height:1.1}
.verdict .big.up{color:var(--warn)} .verdict .big.down{color:var(--ok)}
.verdict .what{font-size:15px;color:var(--ink-2);margin:8px 0 0}
.verdict .seg-note{font-size:12.5px;color:var(--muted);margin:12px 0 0;line-height:1.6}
.verdict .scale{position:relative;height:30px;margin:20px 0 6px;
  background:var(--line-2);border-radius:6px}
.verdict .scale .iqr{position:absolute;top:0;bottom:0;background:var(--accent-soft)}
.verdict .scale .med{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--muted)}
.verdict .scale .you{position:absolute;top:-5px;bottom:-5px;width:3px;background:var(--accent);
  border-radius:2px}
.verdict .ticks{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}

.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:1px;
  background:var(--line);border:1px solid var(--line);border-radius:var(--radius);
  overflow:hidden;margin:8px 0 0}
.facts div{background:var(--paper);padding:14px 16px}
.facts .v{font-size:19px;font-weight:600;letter-spacing:-.015em}
.facts .k{font-size:11.5px;color:var(--muted);margin-top:3px}

/* історія ціни */
.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:104px 1fr auto;gap:14px;align-items:baseline;
  padding:11px 0;border-bottom:1px solid var(--line-2)}
.tl li:last-child{border-bottom:0}
.tl .d{font-size:12.5px;color:var(--muted)}
.tl .p{font-size:15px;font-weight:580}
.tl .delta{font-size:12.5px}
.tl .delta.up{color:var(--warn)} .tl .delta.down{color:var(--ok)}
.tl .s{font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}

.srclist{list-style:none;margin:0;padding:0}
.srclist li{display:flex;justify-content:space-between;gap:14px;align-items:baseline;
  padding:10px 0;border-bottom:1px solid var(--line-2)}
.srclist li:last-child{border-bottom:0}
.srclist a{color:var(--accent);text-decoration:none;font-size:13.5px}
.srclist a:hover{text-decoration:underline}
.srclist .p{font-weight:580;white-space:nowrap}

.roadmap{list-style:none;margin:0;padding:0;font-size:13.5px}
.roadmap li{display:grid;grid-template-columns:22px 130px 1fr;gap:10px;padding:7px 0;
  border-bottom:1px solid var(--line-2);color:var(--ink-2)}
.roadmap li:last-child{border-bottom:0}
.roadmap .mark{color:var(--ok);font-weight:600}
.roadmap .when{font-variant-numeric:tabular-nums;color:var(--ink)}
.back{font-size:13.5px;color:var(--muted);text-decoration:none}
.back:hover{color:var(--accent)}
a.analyse{color:var(--accent);text-decoration:none}
a.analyse:hover{text-decoration:underline}

@media (max-width:820px){
  .bar{grid-template-columns:1fr auto;gap:6px 12px}
  .bar .track{grid-column:1/-1;order:3}
  .verdict .big{font-size:27px}
  .tl li{grid-template-columns:1fr auto}
  .tl .d{grid-column:1/-1}
}
</style>
