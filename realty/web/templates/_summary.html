  <section class="summary">
    <div class="metric">
      <span class="v num">{{ stats.total }}</span>
      <span class="k">оголошень{% if matched != stats.total %} · <b>{{ matched }}</b> за фільтром{% endif %}</span>
    </div>
    <div class="metric">
      <span class="v num">${{ stats.median_sqm | money }}</span>
      <span class="k">типова ціна за м²</span>
    </div>
    <div class="metric">
      <span class="v num">${{ stats.median_price | money }}</span>
      <span class="k">типова ціна квартири</span>
    </div>
    <div class="spacer"></div>
    <div class="updated">оновлено {{ stats.updated | relative_date }}</div>
  </section>
