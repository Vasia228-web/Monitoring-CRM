<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>{% block title %}Нерухомість Івано-Франківська{% endblock %}</title>
<style>
:root{
  --paper:#fbfaf8; --card:#fff; --ink:#15171c; --ink-2:#4a5058; --muted:#8a9099;
  --line:#e4e1dc; --line-2:#ebe8e3; --accent:#1d4ed8; --accent-soft:#eef2ff;
  --ok:#15704f; --warn:#a1571c; --shadow:0 1px 2px rgba(20,22,28,.05);
  --radius:10px;
}
:root:not([data-theme="light"]){ color-scheme:light }
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#0d0f13; --card:#14171c; --ink:#e9ebef; --ink-2:#b3bac4; --muted:#7d858f;
    --line:#232830; --line-2:#1b1f26; --accent:#7ea2ff; --accent-soft:#182034;
    --ok:#4cb98d; --warn:#d69a52; --shadow:none;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#0d0f13; --card:#14171c; --ink:#e9ebef; --ink-2:#b3bac4; --muted:#7d858f;
  --line:#232830; --line-2:#1b1f26; --accent:#7ea2ff; --accent-soft:#182034;
  --ok:#4cb98d; --warn:#d69a52; --shadow:none;
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font:15px/1.55 ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;
}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
.wrap{max-width:1180px;margin:0 auto;padding:44px 28px 96px}

/* ---------- шапка ---------- */
header{margin-bottom:34px}
h1{font-size:27px;font-weight:640;letter-spacing:-.022em;margin:0 0 6px}
.lede{color:var(--muted);font-size:14px;margin:0;max-width:60ch}

/* ---------- зведення ---------- */
.summary{
  display:flex;flex-wrap:wrap;gap:44px;align-items:flex-end;
  padding:20px 0 22px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);
  margin-bottom:26px;
}
.metric .v{display:block;font-size:26px;font-weight:620;letter-spacing:-.02em;line-height:1.15}
.metric .k{display:block;font-size:12px;color:var(--muted);margin-top:3px;letter-spacing:.01em}
.metric .k b{color:var(--ink-2);font-weight:500}
.summary .spacer{flex:1}
.updated{font-size:12px;color:var(--muted);text-align:right}

/* ---------- фільтри ---------- */
form.filters{
  display:flex;flex-wrap:wrap;gap:10px 18px;align-items:flex-end;margin-bottom:8px;
}
.field{display:flex;flex-direction:column;gap:5px}
.field > span{font-size:11px;color:var(--muted);letter-spacing:.045em;text-transform:uppercase}
select,input[type=number]{
  font:inherit;font-size:14px;color:var(--ink);background:var(--card);
  border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:118px;
  box-shadow:var(--shadow);appearance:none;
}
select{padding-right:26px;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),
                   linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 14px) 51%,calc(100% - 9px) 51%;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat}
input[type=number]{min-width:96px}
select:focus,input:focus{outline:none;border-color:var(--accent);
  box-shadow:0 0 0 3px var(--accent-soft)}

/* сегментований перемикач стану — головний фільтр, тому окремо */
.seg{display:flex;background:var(--line-2);border:1px solid var(--line);border-radius:9px;padding:2px}
.seg label{position:relative;cursor:pointer}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:block;padding:6px 13px;font-size:13.5px;color:var(--ink-2);
  border-radius:7px;white-space:nowrap;transition:background .12s,color .12s}
.seg input:checked + span{background:var(--card);color:var(--ink);font-weight:530;
  box-shadow:var(--shadow)}
.seg input:focus-visible + span{box-shadow:0 0 0 3px var(--accent-soft)}

button.apply{font:inherit;font-size:14px;padding:8px 16px;border-radius:8px;cursor:pointer;
  border:1px solid var(--accent);background:var(--accent);color:#fff}
button.apply.hidden{display:none}
.reset{font-size:13px;color:var(--muted);text-decoration:none;padding-bottom:9px;margin-left:auto}
.reset:hover{color:var(--accent)}

/* ---------- таблиця ---------- */
.tablewrap{overflow-x:auto;margin-top:22px}
table{width:100%;border-collapse:collapse;min-width:880px}
thead th{
  font-size:11px;font-weight:520;letter-spacing:.05em;text-transform:uppercase;
  color:var(--muted);text-align:left;padding:0 12px 9px;border-bottom:1px solid var(--line);
  white-space:nowrap;
}
thead th.r{text-align:right}
thead a{color:inherit;text-decoration:none;display:inline-flex;gap:4px;align-items:center}
thead a:hover{color:var(--ink)}
thead a.on{color:var(--accent)}
thead a .car{font-size:9px;opacity:.85}

tbody td{padding:13px 12px;border-bottom:1px solid var(--line-2);vertical-align:top}
tbody tr:hover td{background:var(--card)}
td.r{text-align:right}

.price{font-size:16.5px;font-weight:600;letter-spacing:-.012em;white-space:nowrap}
.price .alt{display:block;font-size:11.5px;font-weight:400;color:var(--muted);margin-top:2px}
.price .est{display:block;font-size:11px;color:var(--warn);margin-top:2px}

.sqm{font-size:14.5px;white-space:nowrap}
.sqm .dev{display:block;font-size:11px;color:var(--muted);margin-top:2px}

.spec{color:var(--ink-2);font-size:14px;white-space:nowrap}
.spec b{color:var(--ink);font-weight:560}

.addr{color:var(--accent);text-decoration:none;font-size:14.5px;line-height:1.35;
  display:inline-block;max-width:30ch}
.addr:hover{text-decoration:underline;text-underline-offset:2px}
.sub{display:block;font-size:11.5px;color:var(--muted);margin-top:3px}

.state{display:inline-flex;align-items:center;gap:7px;font-size:13.5px;white-space:nowrap}
.dot{width:6px;height:6px;border-radius:50%;background:var(--muted);flex:none}
.state.reno{color:var(--ok)} .state.reno .dot{background:var(--ok)}
.state.need{color:var(--warn)} .state.need .dot{background:var(--warn)}
.state.unk{color:var(--muted)} .state.unk .dot{background:transparent;
  box-shadow:inset 0 0 0 1px var(--muted)}

.mkt{font-size:13.5px;color:var(--ink-2);white-space:nowrap}
.when{font-size:13.5px;color:var(--ink-2);white-space:nowrap}
.src{font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.src i{font-style:normal;opacity:.6}

tr.gone td{opacity:.55}
tr.gone .price{text-decoration:line-through;text-decoration-thickness:1px}
button.mark{font:inherit;font-size:12px;padding:3px 9px;border-radius:999px;cursor:pointer;
  border:1px solid var(--line);background:var(--chip);color:var(--ok);white-space:nowrap}
button.mark.off{color:var(--warn)}
button.mark:hover{border-color:var(--accent)}
button.mark:disabled{opacity:.5;cursor:progress}
button.mark:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.empty{padding:70px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:16px;font-weight:560;margin-bottom:6px}
.empty code{background:var(--line-2);padding:2px 7px;border-radius:5px;font-size:13px}
.legend{margin-top:18px;font-size:12px;color:var(--muted);line-height:1.7}

/* ---------- мобільний: рядки стають картками ---------- */
@media (max-width:820px){
  .wrap{padding:26px 16px 64px}
  h1{font-size:22px}
  .summary{gap:26px;padding:16px 0}
  .metric .v{font-size:21px}
  .updated{text-align:left;width:100%}
  form.filters{gap:12px}
  .field{flex:1 1 128px}
  .reset{margin-left:0}
  .seg{width:100%}
  .seg label{flex:1} .seg span{text-align:center;padding:7px 6px}
  .tablewrap{overflow:visible}
  table{min-width:0}
  thead{display:none}
  tbody tr{display:grid;grid-template-columns:1fr auto;gap:2px 14px;
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:14px;margin-bottom:10px;box-shadow:var(--shadow)}
  tbody td{border:0;padding:0}
  tbody tr:hover td{background:transparent}
  td[data-l="Ціна"]{grid-column:1;order:1}
  td[data-l="$/м²"]{grid-column:2;order:2;text-align:right}
  td[data-l="Локація"]{grid-column:1/-1;order:3;margin-top:8px}
  td[data-l="Параметри"]{grid-column:1/-1;order:4;margin-top:8px;
    padding-top:10px;border-top:1px solid var(--line-2)}
  td[data-l="Стан"]{grid-column:1;order:5;margin-top:6px}
  td[data-l="Ринок"]{grid-column:2;order:6;margin-top:6px;text-align:right}
  td[data-l="Опубліковано"]{grid-column:1;order:7}
  td[data-l="Джерело"]{grid-column:2;order:8;text-align:right}
  .addr{max-width:none}
}

/* ---------- спільна шапка ---------- */
.topbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:26px;
  padding-bottom:14px;border-bottom:1px solid var(--line)}
.brand{font-weight:640;font-size:15px;letter-spacing:-.01em;margin-right:6px}
.nav{display:flex;gap:4px;flex-wrap:wrap}
.nav a{font-size:13.5px;padding:6px 12px;border-radius:8px;text-decoration:none;
  color:var(--ink-2);border:1px solid transparent}
.nav a:hover{background:var(--line-2);color:var(--ink)}
.nav a.on{background:var(--card);border-color:var(--line);color:var(--ink);
  font-weight:540;box-shadow:var(--shadow)}
.nav a .count{font-variant-numeric:tabular-nums;color:var(--muted);margin-left:5px}
.nav .right{margin-left:auto}
.topbar .spacer{flex:1}

/* ---------- попередження фільтра ---------- */
.warn{background:var(--warn-soft,#f8eee1);color:var(--warn);border-radius:8px;
  padding:11px 14px;margin-bottom:18px;font-size:13.5px}

/* ---------- кнопка «взято в обробку» ---------- */
button.take{font:inherit;font-size:12px;padding:4px 11px;border-radius:999px;cursor:pointer;
  border:1px solid var(--line);background:var(--card);color:var(--ink-2);white-space:nowrap}
button.take:hover{border-color:var(--accent);color:var(--accent)}
button.take.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);
  font-weight:540}
button.take:disabled{opacity:.5;cursor:progress}
button.take:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
tr.taken td{background:var(--accent-soft)}
.empty a{color:var(--accent)}
</style>
</head>
<body data-page="{{ page }}">
<div class="wrap">

  {# Навігація живе в layout, тому автоматично є на кожній сторінці. #}
  <nav class="topbar">
    <span class="brand">Нерухомість Івано-Франківська</span>
    <span class="nav">
      <a href="/" class="{{ 'on' if page == 'list' }}">Моніторинг</a>
      <a href="/processing" class="{{ 'on' if page == 'processing' }}">В обробці<span class="count">{{ in_work or 0 }}</span></a>
    </span>
    <span class="spacer"></span>
    <span class="nav"><a href="/status" class="{{ 'on' if page == 'status' }}">Стан системи</a></span>
  </nav>

  {% block content %}{% endblock %}
</div>
{% block scripts %}{% endblock %}
</body>
</html>
