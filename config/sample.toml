# Контрольна вибірка Блоку 1 — `cli.py liveness sample` (рішення власника 08.10, D55 п. 7;
# критерій приймання Блоку 1; хвиля W3, D58).
#
# Схема — realty/configfiles.py (SampleConfig). Код — realty/liveness/sample.py.
# Раз на тиждень (realty-liveness-sample.timer, середа 10:20): для кожного джерела, що
# перевіряється (config/liveness.toml, hosts.*.checkable), — `per_source` випадкових
# АКТУАЛЬНИХ оголошень (як на сайті: якість «ok» і чинна актуальність) плюс контрольні
# (відомо живі — той самий вибір, що й ярус canary, queue.canary_keys). Перевірка — ТИМ
# САМИМ підписом (engine.run_items), під замком циклу, у звичайному темпі хостів.
# Стану оголошень вибірка НЕ змінює: результати — в ops.liveness_sample_*; «знято» —
# лише підказка звичайній перевірці (відкладене завдання «opened» квартири), яка йде
# через запобіжник. Межі запобіжника (`share`, `min_checked`) — liveness.toml [fuse].

[run]
# 100 на джерело — D55 п. 7 (критерій приймання Блоку 1: ≤5% знятих серед 100
# випадкових актуальних). Найповільніший хост — dom.ria.com (GET, ~1 с + відповідь):
# ~100–130 ключів ≈ 5–10 хв; rieltor.ua 3 с × ~40 ключів LUN ≈ 2 хв (розрахунок, D58).
per_source = 100
# Контрольних на хост — як canaries_per_run кроку циклу, але більше: вибірка рідка.
canaries_per_host = 10
pace = "cycle"
# Стеля мережевої фази від старту під замком: 10:20 + 30 хв очікування замка + 60 хв =
# 11:50 < 12:05 (наступний цикл не пропуститься).
max_minutes = 60
# Замок циклу зайнятий (цикл 09:05 затягнувся, ручний запуск) — чекати стільки хвилин,
# далі — відмова з попередженням у зведенні (liveness-sample-skipped).
lock_wait_minutes = 30
# Зерно випадкового вибору: вибірка відтворювана (зерно + дата запуску).
seed = 20261014

[verdict]
# «Знято» серед випадкових ≤ 5% — гаразд (критерій Блоку 1, D55 п. 7). Понад fuse.share
# (20%) при n ≥ fuse.min_checked — критична тривога, рішення власника.
max_removed_share = 0.05
# Менше перевірених (блокування, стеля часу) — вердикту немає («замало відповідей»).
min_checked = 20
# Скільки «знятих» показати поіменно у звіті й зведенні.
examples = 15
# Тривога сторожа за прогоном тримається до наступного прогону (щотижня), але не довше
# за стільки діб: вимкнений таймер не тримає давню тривогу вічно (зведення покаже, що
# вибірки давно не було).
alert_days = 8

[hints]
# «Знято» з вибірки → відкладене завдання перевірки квартири (ops.lookup_checks, ярус
# opened найближчого циклу; через запобіжник). Не для джерела, що зупинилось на
# контрольному чи перевищило fuse.share.
enabled = true
