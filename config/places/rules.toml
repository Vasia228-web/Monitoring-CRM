# Райони й ЖК — правила: нормалізація назв, драбина ступенів, пороги (Блок 4, крок E10).
# Читають: крок циклу «райони й ЖК» (`cli.py places assign`, на старті), зведення
# квартир (`cli.py dedup`), сайт (перечитування раз на 60 с). Походження чисел —
# план Блоку 4 і заміри на копії Етапу 0, переписані в implementation-notes.md D57
# (план лежить поза git).

[normalize]
# Префікси перед назвою, що прибираються перед порівнянням (цілими словами, на
# початку, повторно). Окремо для районів і ЖК (план Блоку 4; D57).
# «с.», «село», «смт», «селище» — так пишуть села flombu і вільний текст («с. Крихівці»;
# рецензія E10).
district_prefixes = ["мкр", "мкрн", "мікрорайон", "м-н", "р-н", "район", "масив", "ж/м", "с", "село", "смт", "селище"]
# «житловий район» — НЕ префікс ЖК: «Житловий район Manhattan» і «Житловий район
# Княгинин» — парасольки, а не ЖК Manhattan чи «ЖК Княгинин» з тим самим словом
# (відхилення від плану, D57: інакше парасолька зливалась би з першою чергою).
complex_prefixes = ["жк", "ж/к", "ж.к.", "житловий комплекс", "житловому комплексі", "кб", "клубний будинок"]
# «Крихівці (Івано-Франківськ)» — так LUN пише села громади (Етап 0: 92 рядки).
strip_suffixes = ["(івано-франківськ)"]
# Лапки й апострофи прибираються (і в назві з довідника, і в назві з джерела).
quotes = "«»\"“”„‘’'`ʼ"
# Латинські двійники кириличних літер: у змішаному слові — до письма більшості.
# Етап 0: «Пасiчна» 463, «Опришівцi» 190, «Рiнь» 23 оголошення з латинською «i»;
# «Comfогt House», «Сity», «Grееn side» у тексті. «rг» — «г» у курсиві схожа на «r».
homoglyphs = ["aа", "eе", "iі", "oо", "pр", "cс", "xх", "yу", "kк", "mм", "tт", "hн", "bв", "rг"]

[tiers]
# Порядок ступенів (план Блоку 4). Район: ЖК з поля джерела, прив'язаний до району →
# інші квартири того самого будинку (addr: ≥ link.min_share при n ≥ link.min_n; рецензія
# E10 — поле агента DOM.RIA збігається з будинком лише в 79,7%, у ЖК без району — 70,7%,
# а план вимагає ≥90%) → поле району джерела → ЖК з координат чи тексту → координати
# (kNN). ЖК: id джерела → назва з поля джерела → координати → заголовок. Ступінь, якого
# немає в списку, вимкнено.
district = ["complex_src", "addr", "src", "complex_weak", "coords"]
complex = ["src_id", "src_name", "coords", "text"]
# Слабкі ступені — після нічного проходу LUN і заміру точності (E11): «лише туди, де
# порожньо» лишило б назавжди слабше значення, якщо воно зайняло місце раніше.
coords_enabled = false
text_enabled = false

[coords]
# Лише точні точки: OLX дає центр міста (Етап 0: 142 зі 152 карт — 48.918, 24.713).
precise_geo = ["point", "building"]
# Район за kNN: симуляція на копії — 0,925 точності при 250 м і згоді 0,9 (покриття
# 33%); 0,843 при 350 м і 0,8 (план Блоку 4, D57).
district_k = 9
district_radius_m = 250.0
district_min_refs = 5
district_agree = 0.9
# ЖК за координатами: 0,958 при 100 м, ≥3 точках, одностайно; лише LUN і flombu
# (точки DOM.RIA у 51% — центр ЖК), лише первинка й невідомий ринок.
complex_radius_m = 100.0
complex_min_refs = 3
complex_sources = ["lun", "flombu"]
complex_markets = ["primary", "unknown"]
# Самоперевірка на кожному запуску: ціль відкладається разом з усіма точками ближче
# 60 м (інакше «вгадує» сусідня копія того самого будинку); нижче порогу ступінь не
# заповнює нічого (запис у places_runs.precision).
validate_exclude_m = 60.0
validate_sample = 2000
min_precision_district = 0.90
min_precision_complex = 0.95

[text]
# ЖК із заголовка — лише точна назва з довідника одразу після маркера; точність
# міряється на DOM.RIA, де є поле (план Блоку 4).
fields = ["title"]
markers = ["жк", "ж/к", "житловий комплекс", "житловому комплексі"]
min_precision = 0.95

[link]
# Прив'язка ЖК → район і мікрорайон LUN → батьківський район: ≥80% при n≥5 (план
# Блоку 4; внутрішнє рішення D57). Застосовує скрипт scripts/places_seed.py, голоси —
# у коментарях довідника. Той самий поріг — для ступеня addr (голоси інших квартир
# будинку).
min_share = 0.8
min_n = 5

[secondary]
# «Не в ЖК» — лише вторинка без жодної ознаки ЖК у полях і в тексті (Етап 0: 62%
# вторинки DOM.RIA має ЖК у полі — «вторинка = без ЖК» хибне), джерело справді
# показувало поле ЖК (DOM.RIA; OLX — після сторінки; LUN — після проходу з geoEntities)
# і жодна інша квартира будинку не має ЖК «з джерела».
# ВИМКНЕНО ([]) до перевіреної вибірки власника (рецензія E10: точність лише 59%,
# ціль — ≥98%, як у ЖК «з джерела»; D57). Увімкнути — markets = ["secondary"].
markets = []
forbid_zhk_words = true

[addr]
# Мітка села LUN відкидається, якщо щонайменше стільки оголошень DOM.RIA ІНШИХ квартир
# того самого будинку кладуть його в міський район (рецензія E10: 110 рядків сайту
# «громада» на будинках, які DOM.RIA лістить у місті).
village_veto_min_ria = 3

[area]
# Невідома місцевість рахується містом у «Тільки місто»: інакше звідти зникли б тисячі
# міських оголошень OLX без району (план Блоку 4).
unknown_counts_as_city = true

[guard]
# Непорожні ключі крок НЕ змінює: різниця лише рахується (would_change) і видна на
# /status (внутрішнє рішення D47 п. 4; інтеграція, конфлікт 13).
allow_changes = false

[assign]
# Рядків на транзакцію запису (як links reindex: ≤200, ≤1 с на Fedora — Блок 2).
batch_rows = 200

[reassign]
# `cli.py places reassign --apply` (виправлення ВИЗНАЧЕНИХ ключів — лише за рішенням
# власника) відмовляє без успішного бекапу, свіжішого за стільки хвилин (план Блоку 4).
backup_max_age_min = 60

[status]
# Нерозпізнані назви на /status: скільки показати, з якої кількості оголошень, скільки
# прикладів id.
unknown_limit = 200
unknown_min_count = 1
examples = 3

[audit]
# Види протиріч зведення, з яких рахується suspicious_core для тривоги сторожа: нові
# complex і complex_phase туди не входять, інакше перша ж перевірка з ними дала б
# хибну тривогу «підозрілих різко більше» (поріг ×1,3 + 20; план Блоку 4).
core_kinds = ["ria_flat", "korpus", "building", "price", "area", "floor", "condition", "geo"]
# Окрема тривога за видом complex — лише коли є щонайменше стільки перевірок із ним.
complex_min_audits = 4

[sources]
# Які geoEntities LUN зберігати в place_raw.lun_geo (план Блоку 4).
lun_geo_types = ["microdistrict", "residential_complex", "city", "village", "settlement"]
# flombu: місто чи ні — за координатами (той самий BBOX, що й у LUN), а не за текстом
# адреси. Внутрішнє рішення D47 п. 8: виправлений зв'язок `location` дає координати, і
# збір flombu зростає з 27 до ~400 квартир (API: 408 у прямокутнику міста, 34
# сторінки; частина — у селах громади). false — як до E10 (текст), лише рахувати.
flombu_city_by_coords = true

[labels]
hromada = "громада"
outside = "поза громадою"
unknown_district = "район не визначено"
unknown_complex = "ЖК не визначено"
none_complex = "не в ЖК"
area_city = "Тільки місто"
area_all = "Місто з громадою"
# «Звідки» значення — підказка біля району на сторінці квартири.
how = { complex_src = "за ЖК", addr = "за будинком (інші оголошення за цією адресою)", addr_area = "за будинком (мітку села LUN відкинуто)", src = "з джерела", complex_weak = "за ЖК (з тексту чи координат)", coords = "за координатами", src_id = "з джерела", src_name = "з джерела", text = "із заголовка", secondary = "вторинка без ознак ЖК" }
