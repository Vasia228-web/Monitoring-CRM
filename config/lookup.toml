# Пошук за посиланням (Блок 5, крок E14, D59): поле у верхній панелі сайту,
# сторінка «/find», кнопка «Перевірити зараз».
#
# Схема — realty/configfiles.py (LookupConfig), код — realty/lookup/resolve.py
# (пошук у базі), realty/lookup/limits.py (ліміти й черга), realty/lookup/link.py
# (процес перевірки realty-lookup@), realty/web/find_routes.py (сторінки).
# Значень за замовчуванням у коді немає (`cli.py config check`).
#
# Розбір самого посилання (хости, мобільні версії, параметри відстеження,
# якорі, слеш у кінці) — спільний `config/links.toml` (крок E6, D51); тут лише
# те, що стосується пошуку й перевірки. Сайт сам у мережу не ходить ніколи:
# «Перевірити зараз» ставить завдання в чергу ops.lookup_checks, а виконує його
# окремий процес (шаблон systemd realty-lookup@, той самий, що й перевірка при
# відкритті квартири, D50).
#
# Усі рішення нижче оборотні правкою цього файлу (окремий коміт → тести →
# розгортання між циклами, config/README.md).

[ui]
# Підказка в полі пошуку (верхня панель кожної сторінки, обидві ролі — D47 п. 9).
placeholder = "Вставте посилання на оголошення"
# Назва поля для читачів екрана й підказка при наведенні.
label = "Знайти квартиру за посиланням на оголошення, номером квартири чи id оголошення"
button = "Знайти"
# Стеля довжини вставленого тексту (текст «Поділитися» з назвою й посиланням —
# сотні символів; довше — обрізається, а не відхиляється). План Блоку 5 (D59).
max_input_chars = 2048
# Скільки квартир показувати на сторінці вибору (ключ, що веде в кілька квартир:
# 107 таких ключів на копії бази, найбільше — 3 квартири; D51).
choice_limit = 20

[check]
# «Перевірити зараз»: загальний вимикач (false — кнопки немає ніде).
enabled = true
# Сайти, для яких кнопка є на сторінці «ще немає в базі». flombu і лише-LUN
# (lun.ua/realty/…) — ВИМКНЕНО, доки форми їхніх посилань не перевірено наживо
# (одноразова нічна робота ~16 запитів, D59; у links.toml вони позначені
# needs_live_verification). Благо не перевіряється взагалі (рішення власника 3, D46).
families = ["domria", "olx", "rieltor"]
# Сайти, для яких перевірка може ДОДАТИ нове оголошення в базу звичайним
# конвеєром якості (gate.screen + _upsert, без LLM). DOM.RIA — одна картка API
# дає все (місто, тип, операцію, повний запис). OLX і rieltor — лише «живе /
# знято / не знайдено»: розбирача однієї сторінки з містом для них немає (OLX
# потребує браузера, rieltor ми бачимо лише через LUN), D59.
insert_families = ["domria"]
# Скільки НОВИХ перевірок за годину (ковзне вікно, рахується в ops.db) може
# поставити кожна роль; 0 — кнопки для ролі немає. Друг — 10 (пропозиція плану
# Блоку 5, D47 п. 9, оборотно), власник — 30.
per_role_per_hour = { owner = 30, friend = 10 }
# Повторне «Перевірити зараз» того самого оголошення в межах цього вікна
# показує вже наявну перевірку (і її результат) без нового запиту до сайту.
same_key_reuse_minutes = 10.0
# Як часто сторінка питає про стан перевірки (мс).
poll_ms = 1500
# Скільки сторінка чекає результату, перш ніж написати «перевірка ще йде —
# оновіть сторінку пізніше» (с). Стеля процесу — open_check.job_timeout_s.
wait_max_s = 180.0
# Картка DOM.RIA (realty/data/<id>?lang_id=4): що вважати квартирою на продаж.
# Значення — як у фільтрі пошуку збирача (realty/sources/domria.py:
# realty_type=2 — квартира, operation_type=1 — продаж); у справжній картці
# (локальний зразок probes/_ria_sample.json на MacBook) — realty_type_id = 2
# «Квартира», advert_type_id = 1 «продаж» (seen_in_probe, D59). Невідоме значення —
# «не квартира на продаж», без вставки (консервативно).
domria_flat_realty_type_ids = [2]
domria_sale_advert_type_ids = [1]
# Стеля тіла картки (байт): картки Етапу 0 — 5–6 КБ, з описом — до ~20 КБ.
domria_card_max_bytes = 2000000

[city]
# Місце з адреси оголошення DIM.RIA (slug «realty-prodaja-kvartira-<місце>-…») і
# rieltor.ua (сегмент «/<місце>/flats-sale/…», числовий хвіст «-637» відкидається):
# не з цього переліку і в базі такого ключа немає — «схоже, не з Івано-Франківська
# («kiev»)» БЕЗ запиту; кнопка «Перевірити зараз» лишається як підтвердження (рецензія
# E14, 08.10). Перелік — усі місця, що є в адресах бази (копія Етапу 0, лише читання,
# 08.10): DIM.RIA — ivano-frankovsk 9 149, ivanofrankovsk 30, krihovtsy 13, ugorniki 6,
# volchinets 4, nikitintsy 2, kluzov 1, kropivnitskiy 1, ugrinov 1, chukalovka 1;
# rieltor (через LUN) — ivano-frankovsk 2 903, volchinets 124, krihovtsy 118,
# nikitintsy 45, ugrinov 14, ugorniki 7, chukalovka 5, podpeschery 3, zagvozdje 2,
# hriplin 1, lisets 1. Нове село громади в базі — додати сюди (інакше його посилання
# до першого збору показуватиме «схоже, не з Івано-Франківська»). OLX без мережі не
# розрізнити — для нього цього кроку немає.
known_places = ["ivano-frankovsk", "ivanofrankovsk", "krihovtsy", "volchinets", "nikitintsy", "ugorniki", "ugrinov", "chukalovka", "podpeschery", "zagvozdje", "hriplin", "lisets", "kluzov", "kropivnitskiy"]
# Slug квартир на продаж DIM.RIA: усі 9 208 slug бази починаються саме так (копія Етапу
# 0); інший початок — місця з адреси не читаємо (лишається «ще немає в базі»).
domria_slug_prefix = "realty-prodaja-kvartira-"

[sites]
# Назви сайтів на сторінках пошуку («Впізнали: OLX · ID10BkYC»).
domria = "DIM.RIA"
olx = "OLX"
rieltor = "rieltor.ua"
lun = "ЛУН"
flombu = "flombu"
blago = "Благо"
own = "наш сайт"

