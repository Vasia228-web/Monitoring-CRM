# Блок 1 промту 11 — перевірка актуальності оголошень (зняті / живі), крок E8 (D52).
#
# Схема — realty/configfiles.py (LivenessConfig). Значень за замовчуванням у
# коді немає: кожен ключ обов'язковий (`cli.py config check`).
#
# Код — пакет realty/liveness (класифікатор, черга-ярусів, запобіжник,
# застосування пакетами) і realty/verify.py (тонка обгортка, крок циклу
# «перевірка актуальності»). Формати посилань — config/links.toml.
#
# НЕДОТОРКАНЕ ПРАВИЛО (рішення власника 1, D46): знімаємо лише за явним
# сигналом — 410, явний банер/елемент сторінки, або 404, що повторився
# `repeat_404.count` разів з інтервалом, І перевірка існування показала, що
# оголошення справді немає. Один 404 — «не знайдено» (не знято); відсутність у
# стрічці чи переліку не знімає НІКОЛИ; капча, порожня сторінка, 5xx, тайм-аут —
# «не визначено». 404 у `removed_statuses` схема не приймає.
#
# Походження чисел: «Етап 0, D45» — живі заміри; «план Блоку 1, D52» — проєкт
# Блоку 1 (b1-liveness) з поправками інтеграції (D47), його числа й розрахунки
# переписано в журнал у D52, бо сам план лежить поза git.

[run]
# Оголошення, яке пробували перевірити менше ніж стільки хвилин тому, при
# відкритті картки повторно не перевіряється: повторні відкриття тієї самої
# квартири не множать запитів до джерела. 10 хв — план Блоку 2 (D48:
# open_check_min_interval_min = 10), затверджено інтеграцією як спільний ключ
# для перевірки при відкритті (сайт) і ярусу «opened» Блоку 1 (D50).
opened_recheck_minutes = 10
# Стеля мережевої фази одного прогону в циклі, хв, — від СТАРТУ процесу кроку
# (план черги й відкладені завдання — теж у ній): смуги хостів самі перестають
# брати нові ключі й не починають перевірок існування; застосування — після (≤1 с
# на пакет). Крок «перевірка актуальності» має 30 хв (runner.TASK_TIMEOUTS): 8 хв
# запасу — запити, що вже в дорозі (GET DOM.RIA до ~75 с), застосування й зведення.
# Схема перевіряє: ≤ ліміт кроку − 5 хв, а порції кожного хоста × delay ≤ 80%
# стелі. План Блоку 1 давав 25 — рецензія E8 (D52): 25 + 2,5 + 0,5 ≈ 28 із 30.
budget_minutes = 22
# Рядків на транзакцію застосування: ≤200 — інтеграційний план, «зміни даних»
# (пакети ≤200 рядків, ≤1 с на транзакцію; конфлікт 7, D47).
apply_batch_rows = 200
# Скільки 401/403/429 поспіль зупиняють смугу хоста до наступного прогону (було
# MAX_CONSECUTIVE_BLOCKS = 5 у коді verify.py).
max_consecutive_blocks = 5
# Повтор ключа після 1, 2, 3, 4+ незрозумілих відповідей поспіль (капча, 403,
# тайм-аут), год — замість вічного кінця черги: 739 OLX із check_failures=1
# чекали до 17 діб (план Блоку 1, D52).
unknown_backoff_hours = [3, 12, 24, 72]
# Графік перевірок оголошення, що зникло з повного переліку пошуку
# (listings.absent_since): одразу, через добу, 3 доби, тиждень; далі — звичайний
# строк хоста. Лікує «кандидат лише раз» (1 236 DOM.RIA після одного 200 більше
# не перевірялись, Етап 0, D45; план Блоку 1, D52).
absent_backoff_hours = [0, 24, 72, 168]
# Зняте, що знову з'явилось у стрічці, перевіряти не раніше ніж через стільки
# годин (індекс пошуку DOM.RIA запізнюється; план Блоку 1, D52).
reseen_grace_hours = 6
# «Знову бачили в стрічці» до цього моменту (UTC) — артефакт D43 (дату ставив
# будь-який запис): 2 375 із 2 982 «знятих, але знову бачених» (D47). Такі
# last_seen ярус reseen не бере.
reseen_ignore_before = "2026-09-23T08:00:00"
# Відкриту картку перевірити в найближчому прогоні, якщо її оголошення не мали
# зрозумілої перевірки після відкриття, а відкривали не давніше за стільки
# годин (ярус «opened» — запасний шлях до черги realty-lookup@; план Блоку 1, D52).
opened_priority_hours = 6
# Контрольні ключі («відомо живі»): усі рядки актуальні, хоч один бачили в
# стрічці не давніше за стільки годин, не зниклі з переліку, остання перевірка
# не «знято». 24 год ≈ 8 циклів по 3 год (розрахунок, D52).
canary_fresh_hours = 24

[repeat_404]
# Знято за 404 лише після стількох 404 поспіль — сусідні зараховані не ближче
# ніж `min_interval_hours` (тобто ≥48 год від першого) — і лише після негативної
# перевірки існування (рішення власника 1, D46; план Блоку 1: 3 / 24 год, D52).
# Будь-яка інша відповідь між ними обриває серію.
count = 3
min_interval_hours = 24
# Ключ, який бачили в стрічці (OLX чи LUN) не давніше за стільки годин, існує:
# ремонтуємо посилання, а не знімаємо (план Блоку 1, D52). Лише «є»: НЕ бачили —
# не доказ відсутності (стрічка OLX обрізана 25 сторінками, ~1 100 із 2 488;
# рецензія E8, D52) — «немає» стрічка не каже ніколи.
feed_presence_hours = 72
# Серія вже набрала `count`, а оголошення існує без робочої адреси чи перевірка
# існування не відповіла: наступні 404-перевірки — через 1, 3, 7 діб, далі щотижня
# (а не щодоби назавжди з 2–3 запитами існування; рецензія E8, D52).
after_count_hours = [24, 72, 168]

[removed_sample]
# Регулярна вибірка вже знятих (рішення власника 1, D46): серед знятих за
# `window_days`, той самий ключ — не частіше ніж раз на `min_gap_days`. Живі
# повертаються автоматично з подією «повернулось». Розмір на прогін — у
# таблицях хостів (`removed_sample_per_run`). План Блоку 1, D52.
window_days = 30
min_gap_days = 7

[fuse]
# Запобіжник (правило ескалації промту): підпис «знято» спрацював на понад 20%
# перевірених оголошень одного джерела за прогін → для джерела нічого не
# знімаємо (і не повертаємо), тривога в Telegram (сторож), чекаємо, доки власник
# зніме запобіжник на /status.
#
# Як рахувати 20% — рішення власника 08.10 (D55): лише серед випадкових
# (сліпих) перевірок і контрольних — режим "tiered". Раніше (D52):
#   "literal" — кожне перевірене оголошення джерела в прогоні (усі яруси, і вже
#               зняті з вибірки знятих), «спрацював» — вердикт «знято»;
#   "tiered"  — пропозиція плану Блоку 1: сліпі (обхід) + контрольні — межа
#               `share`; підказані (зникли з переліку, знову в стрічці,
#               повторний 404, відкриті) і ще актуальні рядки ключів вибірки
#               знятих — окремо з межею `hinted_share`; уже зняті — не в частці.
# Відповідь власника перемкне цей ключ (окремим комітом, рядок у Deviations).
# В обох: частка — і за джерелом рядка, і за сайтом, чий підпис спрацював (копії
# LUN чужих оголошень не розчиняються в пулі lun); ярус held (перевірка «знято»,
# не застосованого під запобіжником, після того як власник його зняв) — поза
# частками: зняття запобіжника — схвалення цих вердиктів (рецензія E8, D52).
# Увага: при "literal" найімовірніше тримаються domria (Етап 0: 81% кандидатів
# «зникли з переліку» — архів) і lun (перший повний перелік LUN позначить сотні
# зниклих копій); утримання lun зупиняє весь сліпий обхід rieltor і заморожує
# ключі OLX із копіями LUN (D45, D52).
mode = "tiered"
# Межа частки «знято» і мінімум перевірених рядків джерела, з якого частку
# взагалі рахуємо (n≥20 — план Блоку 1, D52): на 3 оголошеннях однієї квартири
# «2 з 3» — не ознака зламаного підпису.
share = 0.20
min_checked = 20
# Лише для "tiered": підказані перевірки (за задумом здебільшого знаходять
# зняте) спрацьовують лише на явно аномальне «все зняте» (план Блоку 1, D52).
hinted_share = 0.97
hinted_min_checked = 30
# В обох режимах: стільки «знято» серед контрольних (відомо живих) ключів одного
# хоста за прогін — тримати сайт і джерела цих рядків. Рішення власника 08.10
# (D55): банер на БУДЬ-ЯКОМУ відомо живому — зупинка й тривога, тож 1
# (план Блоку 1 пропонував ≥2 з 4, D52).
canary_trip_min = 1
# Малий прогін (не крок циклу: перевірка при відкритті, точкова, ручна з --limit):
# пул, що сам не набрав min_checked, рахується разом із перевірками новим
# підписом за стільки годин — один інтервал таймера циклу (3 год), але не
# раніше, ніж власник востаннє відпустив джерело: інакше прогони по одній
# квартирі ніколи не набирали б min_checked і знімали б без запобіжника
# (рецензія E8, D52).
window_hours = 3

[alerts]
# Тривоги сторожа (realty/watchdog.py, check_liveness) — з останнього прогону
# (ops.liveness_runs), без важких запитів. План Блоку 1, D52.
# Понад стільки активних ключів хоста не перевірено новим підписом удвічі довше
# за його recheck_days.
coverage_overdue_share = 0.10
# Понад стільки GET-сторінок DOM.RIA за прогін не розпізнано (unrecognized або
# conflict) — найімовірніше, змінилась розмітка; рахуємо при n ≥ min_checked.
unrecognized_share = 0.05
unrecognized_min_checked = 20
# Понад стільки знятих за правилом «повторний 404» за 30 днів повернулись —
# правило помиляється (показник помилки правила, рішення власника 1); частку
# рахуємо, коли таких знятих щонайменше repeat404_min_removed (менше — шум).
repeat404_return_share = 0.10
repeat404_min_removed = 10
# Повний перелік джерела старший — для DOM.RIA це головний сигнал зникнення;
# старший перелік не годиться й для перевірки існування.
snapshot_stale_hours = { domria = 9, lun = 48, flombu = 48 }

[snapshot]
# Різниця списків (realty/snapshot.py) — імена модульних констант лишились
# (SHRINK_GUARD, MIN_SIZE, MAX_CANDIDATES, MIN_INTERVAL_HOURS), значення — тут
# (було в коді, перенесено без змін; план Блоку 1, D52).
# Перелік, що впав нижче цієї частки попереднього, — збій збору, не ринок.
shrink_guard = 0.75
min_size = 20
# Стеля НОВИХ позначок absent_since за прогін (захист від лавини).
max_candidates_per_run = 400
# Як часто перелічувати джерело, год (DOM.RIA — 43 запити на ~8,5 тис., LUN — 223).
interval_hours = { domria = 3, lun = 24, flombu = 24 }

[report]
# Панель «Зняті оголошення» на /status і /api/status/liveness (лише власник):
# покриття — частка актуальних ключів із перевіркою новим підписом за стільки
# днів; зняття — за вікнами; частка повернень — серед знятих за return_window_days.
coverage_days = 7
windows_days = [7, 30]
return_window_days = 30

[ui]
# Позначка для оголошень із хостів, які не перевіряються (Благо, рішення
# власника 3, D46). Один ключ для списку, картки квартири й /find (інтеграція,
# конфлікт 17, D47). Текст — план Блоку 1 (відкрите питання 6, D52).
unconfirmed_label = "актуальність не підтверджена"
unconfirmed_hint = "Сайт забудовника не показує, чи планування ще продається"

[ria_page]
# Підпис «знято» DOM.RIA (Етап 0, D45: 18 з 18 знятих, 0 зі 107 живих): GET
# сторінки /uk/…-<id>.html, 200 і ОБИДВІ ознаки — машинний стан сторінки
# window.__INITIAL_STATE__.listing.data.realty (status = "archive", isActive =
# false, isArchive = true, realty_id = id з адреси) і банер класу m-sold з
# точним текстом. Розходяться — «не визначено» (conflict). Фраза «неактуальн» —
# кнопка скарги на ЖИВИХ сторінках, не сигнал (Етап 0).
state_marker = "__INITIAL_STATE__"
state_path = ["listing", "data", "realty"]
id_field = "realty_id"
status_field = "status"
active_field = "isActive"
archive_field = "isArchive"
archive_status = "archive"
active_status = "active"
banner_class = "m-sold"
banner_text = "Оголошення видалено та не бере участі у пошуку"
# План Блоку 1 (D52): «знято» — лише 200 БЕЗ редиректу.
removed_requires_no_redirect = true
# Дата зняття на джерелі (listings.source_removed_at, для строку продажу):
# deleted_at_ts — секунди UTC; запасне deleted_at — час Києва (Етап 0: на
# сторінці 34969888 «2026-10-06 02:00:05» = 1791241205).
deleted_at_ts_field = "deleted_at_ts"
deleted_at_field = "deleted_at"
source_tz = "Europe/Kyiv"
# Перевірка існування за id (лише для правила повторного 404): картка API —
# 13 з 13 знятих мають is_delete/deleted_at (Етап 0), живі — без них;
# beautiful_url — нова адреса для ремонту (так будує адресу й збирач).
api_card_url = "https://dom.ria.com/realty/data/{id}?lang_id=4"
api_deleted_keys = ["is_delete", "deleted_at"]
api_repair_url = "https://dom.ria.com/uk/{beautiful_url}"

[capture]
# Гачки доказів для Блоків 3 (тип продавця) і 4 (район/ЖК) на тілі ТІЄЇ САМОЇ
# відповіді перевірки — один запит на ключ (інтеграція, конфлікт 3, D47). Зараз
# тіло читає лише DOM.RIA (GET). Пишеться ЛИШЕ туди, де порожньо (нові ключі
# JSON; seller_profile — якщо NULL), лише скалярні значення з білого списку
# нижче — імен, телефонів, аватарів і вкладених об'єктів не буває.
# Шлях: «realty.…» — від listing.data.realty стану сторінки, «data.…» — від
# listing.data; «?» у кінці — лише наявність (true/false). Назви ключів — зі схеми
# S3 планів Блоків 3 і 4 (D52).
enabled = true
ria_place = { ria_district = "realty.district_name_uk", ria_district_id = "realty.district_id", ria_newbuild_id = "realty.newbuild_id", ria_newbuild_name = "data.newbuildName.name" }
ria_seller = { ria_offer = "realty.characteristics_values.1437", ria_agency_type = "data.agencyOwner.agency.agency_type", ria_has_agency = "data.agencyOwner.agency.agency_id?" }
# listings.seller_profile = префікс + id користувача DOM.RIA (як identity.seller).
ria_profile = "realty.user_id"
ria_profile_prefix = "ria:"

[olx]
# Перевірка існування OLX за id (адреса лише з ID → канонічна з тим самим ID).
# needs_live_verification: вмикати лише після живої перевірки на кількох живих,
# перейменованих і знятих (план Блоку 1, крок 0; D52). «Немає» — лише 410 (404
# OLX — загальна сторінка помилки). Поки вимкнено, OLX знімається ЛИШЕ за 410:
# `feed` тільки підтверджує існування й дає адресу для ремонту, а «не бачили в
# стрічці» — не доказ (рецензія E8, D52; питання власнику).
id_url = "https://www.olx.ua/d/uk/obyavlenie/ID{id}.html"
id_url_enabled = false

# --- Хости ---------------------------------------------------------------------------------
# Ключ — хост (без www.); `family` — сімейство з config/links.toml (префікс
# listings.site_key). Одна смуга на хост, кожен — одним потоком зі своєю паузою.
# Темп хоста задається ТУТ один раз (інтеграція, конфлікт 4): цикл — `delay`;
# нічна смуга (E9) — max(delay, SOURCES[pace_source].full_delay).
#
# method:   GET (сторінка й підпис) | HEAD (лише код).
# probe:    яку адресу питати — canonical (links.canonical_url: DOM.RIA /uk/…html)
#           чи fetch (links.canonical_fetch_url: rieltor без www, flombu з www…);
#           полагоджена адреса (listings.probe_url) — завжди першою.
# signature: code — лише код; ria_page — стан і банер DOM.RIA ([ria_page]).
# existence: перевірка існування для правила повторного 404, по черзі:
#           feed (лише «є»: бачили в стрічці за feed_presence_hours),
#           snapshot:<джерело> (свіжий повний перелік; «немає» — лише для ключа
#           того самого сайту), ria_api (картка DOM.RIA), olx_id_url. Знято за
#           404 — лише коли хоч одна стратегія ПОКАЗАЛА «немає», а жодна не
#           сказала «є» чи «не відповіла»; без такої стратегії хост 404-м не
#           знімається ніколи.
# Порції на прогін (сліпий обхід, підказані, вибірка знятих, контрольні) і
# строк повторної сліпої перевірки — з виміряної швидкості зникнення h і цілі
# p = 2% насправді знятих серед «активних» (T = 2p/h; план Блоку 1, D52).

[hosts."dom.ria.com"]
family = "domria"
checkable = true
reason = ""
method = "GET"
# 1,0 с — як у verify.py до E8 (Етап 0: 0 відмов, D45).
delay = 1.0
pace_source = "domria"
probe = "canonical"
signature = "ria_page"
# Сторінка ~212 КБ (Етап 0); більше 2 МБ — «не визначено» (too_large).
max_bytes = 2000000
removed_statuses = [410]
# DOM.RIA 404 ненадійний: оголошення 8046 зняли за 404, а воно живе (Етап 0).
not_found_statuses = [404]
existence = ["snapshot:domria", "ria_api"]
