# Блок 2 промту 11 — швидкість сайту: цілі, вимірювання, кеші.
#
# Схема — realty/configfiles.py (SpeedConfig). Значень за замовчуванням у коді
# немає: кожен ключ тут обов'язковий, зайвий чи з неправильним типом — помилка
# (`cli.py config check`). Біля кожного числа — звідки воно взялось.
# «План Блоку 2» — проєкт Блоку 2 з поправками інтеграційної перевірки (D47);
# його числа й заміри, на яких вони стоять, записані в журналі (D48), бо сам
# план лежить поза git. Заміри «до» — Етап 0 (D45).
#
# Діє все (кроки E2–E5, D49–D50): цілі й вимір ([targets], [timings], [rum],
# [probe], [summary], [txn_watch]), кеші шляху запиту ([generations],
# [list_memo], [analytics]), фоновий запис ([deferred]), перевірка при відкритті
# квартири ([open_check]; мінімальний інтервал — config/liveness.toml),
# стиснення ([gzip]) і кеш SQLite ([sqlite]) — читаються на старті сайту
# (зміна — з перезапуском сайту), опитування /status ([status_poll]).
#
# Як змінити: сказати мені → правка цього файлу окремим комітом → тести →
# розгортання між циклами; рядок у Deviations із «було/стало». На Fedora руками
# не правимо.
#
# Налаштування пріоритетів systemd (CPUWeight, IOWeight, Nice, OOMScoreAdjust)
# сюди НЕ входять: їх читає systemd, тож вони живуть у
# deploy/fedora/systemd/*.service (інтеграція, конвенція п. 5).

[targets]
# Ціль власника (промт 11, Блок 2): відповідь сервера на основні сторінки —
# до 300 мс у 95% запитів, і в спокої, і під час циклу збору. Основні сторінки:
# /, /processing, /analytics, /property/{id}, /status, /api/status.
# Заміри «до» на Fedora (D45): головна 1 848 мс, «Аналітика» 11 673 мс (медіани).
server_p95_ms = 300
# Ціль власника: перехід між вкладками — до 1,5 с з телефона по мобільному
# інтернету; рішення власника D46 п. 6 — на вже відкритому з'єднанні (p95 load_ms).
tab_switch_ms = 1500
# Ціль власника: реакція кнопок — до 1,5 с (p95 POST /api/… за resource timing).
button_ms = 1500

[gzip]
# Стиснення відповідей на origin. Заміри плану Блоку 2 (D48): сторінка списку
# 124 КБ → ~12 КБ, «Аналітика» 64 → ~10,5 КБ; ~5 мс процесора на Fedora.
# Дрібні відповіді (JSON кнопок) не стискаємо — поріг плану Блоку 2, D48.
min_bytes = 1000
# Рівень стиснення плану Блоку 2 (compresslevel=5), D48: помірна ціна для
# процесора Pentium N3540 на Fedora.
level = 5

[generations]
# Як часто фоновий потік сайту читає web_generations (лічильники версії даних)
# і стан циклу. Один рядок раз на 5 с — практично безкоштовно (план Блоку 2, D48).
poll_s = 5

[list_memo]
# Кеш упорядкованих id списку для кожного фільтра в межах покоління.
# false — завжди живий запит (~150 мс на Fedora за оцінкою плану Блоку 2, D48).
enabled = true
# Розмір LRU — план Блоку 2, D48 (окремого заміру під це число немає).
max_keys = 64
# Запасний ліміт віку, якщо якийсь запис у базу не збільшив покоління: 15 хв
# (план Блоку 2, D48; цикл збору — раз на ~3 год, кроки — хвилини).
max_age_s = 900

[analytics]
# Перебудувати знімок «Аналітики», навіть якщо покоління не змінилось (цикли
# стали): 6 год = два пропущені цикли по ~3 год (план Блоку 2, D48).
max_age_h = 6
# Скільки кривих виживання (фільтри «Аналітики» й сегменти) тримати в пам'яті:
# розрахунок — 80 комбінацій фільтрів + 39 сегментів = 119 на копії Етапу 0 →
# 128 (план Блоку 2, D48).
km_memo_keys = 128

[deferred]
# Перегляди карток і last_seen сесій пишуться фоном, а не в GET-запиті.
# Замір плану Блоку 2 (D48): під чужим 12-секундним блокуванням GET /property
# чекав 12 047 мс. Період запису 60 с — план Блоку 2, D48 (при падінні сайту
# губиться ≤60 с лічильника переглядів).
views_flush_s = 60
# Скільки фоновий запис чекає зайняту базу, перш ніж відкласти до наступного
# разу — план Блоку 2 (busy_timeout 2 000 мс), D48.
busy_timeout_ms = 2000
# Оновлення last_seen сесії (раз на 5 хв) — фоновим записом, а не в запиті.
session_touch = true
# Стеля буфера фонового запису (рядки журналу часу й маячка), якщо ops.db
# довго зайнята. Замір D49 (tracemalloc, шлях ServerTimingMiddleware →
# WRITER.add): рядок журналу часу ≈0,66 КБ, маячка з 5 кнопками ≈1,1 КБ (а не
# ≈200 Б, як я спершу розрахував) → 6 000 рядків ≈ 4 МБ (до 6,6 МБ, якщо все —
# маячки); межа власника для сайту — приріст RSS ≤40 МБ. Це ≈2,5 год запитів
# двох людей (~40 рядків/хв) під заблокованою ops.db. Понад стелю найстаріші
# рядки відкидаються й рахуються.
max_buffer_rows = 6000

[open_check]
# Перевірка актуальності при відкритті квартири лишається (без урізання), але
# сайт сам у мережу не ходить: відкриття ставить завдання в чергу, результат
# з'являється банером (інтеграція, конфлікт «перевірка під час відкриття»).
# План Блоку 2 (D48) мав open_check_mode = background | off; тут лишився вимикач —
# false лише як аварійний, не типовий стан. Мінімальний інтервал повторної
# перевірки — один спільний ключ run.opened_recheck_minutes у liveness.toml
# (одне значення — одне місце), тому його тут немає.
enabled = true
# Скільки сторінка чекає результату (long-poll ≤30 с), с — план Блоку 2, D48.
wait_max_s = 30
# Як часто long-poll перечитує завдання (один рядок ops.db за ключем), с —
# розрахунок D50: результат з'являється за секунди (HEAD-запити з паузами
# хостів 1–3 с), тож 1 с — непомітна затримка й ≤30 читань на сторінку.
poll_s = 1.0
# Скільки чекати завдання, перш ніж вважати процес перевірки мертвим, с — як
# ліміт самого процесу (TimeoutStartSec=3min у realty-lookup@.service; план
# Блоку 5: 180 с), D50. Тест звіряє це число з юнітом.
job_timeout_s = 180
# Процес перевірки «доїдає» чергу (один за раз — замок data/lookup.lock), але
# нових завдань після стількох секунд не бере: останнє має встигнути до
# job_timeout_s, інакше systemd уб'є процес посеред завдання. Завдання —
# медіана 1, p99 9 HEAD-запитів з паузами хостів (план Блоку 2, D48), на Mac —
# результат за ~15 с (D50); найбільші квартири (26–40 оголошень) із забороненою
# мережею — 18–76 с на M4 лише на паузах хостів (замір D50, рецензія). 60 с
# лишають останньому завданню ≥120 с. Решту черги сайт віддасть наступному
# процесу. Має бути меншим за job_timeout_s (перевіряє `config check`).
drain_budget_s = 60
# Сайт запустив процес перевірки — і ще стільки секунд не запускає іншого, поки
# той стартує й бере завдання (відкриття іншої квартири за цей час дістанеться
# тому самому процесу). Замір D50 (рецензія): від постановки завдання до взяття
# процесом `cli.py lookup check` на M4 — 0,3 с → Fedora ×6–12 ≈ 2–4 с, плюс
# старт юніта systemd і холодний кеш HDD; 30 с — запас ×3 і більше. Взяв і
# вийшов — новий запуск одразу; не взяв за 30 с (упав на старті) — новий запуск.
launch_grace_s = 30
# Як запускати процес перевірки: auto — шаблон systemd realty-lookup@ на Fedora
# (якщо сайт працює службою systemd), інакше окремий процес cli.py; systemd /
# subprocess — примусово (план Блоку 5 «check.launcher», D50).
launcher = "auto"

[sqlite]
# PRAGMA cache_size для з'єднань вебпроцесу (лише сайт), КБ. План Блоку 2 (D48)
# пропонував 8 000 без заміру. Замір D50 (M4, копія Етапу 0 з індексами, 80
# фільтрів «Аналітики», 300 квартир, 64 ключі списку; HEAD до Блоку 2 на тому
# самому навантаженні — 144–151 МБ, межа власника — приріст ≤40 МБ):
#   8 000 → 180–184 МБ, 4 000 → 173–184 МБ, 2 000 → 165–172 МБ;
# час сторінок (теплих і перших) на M4 — однаковий у межах шуму. Кеш сторінок
# SQLite — окремий у КОЖНОГО з'єднання пулу (до 5 у спокої), і знімок
# «Аналітики» заповнює його повністю, тож більше число множиться на з'єднання.
# Тому 2 000 = типове значення SQLite: гарячий набір нових індексів (~3 МБ)
# лишається в кеші ОС. Переглянути за зондом на Fedora.
cache_kb = 2000

[status_poll]
# Опитування на /status — ті самі інтервали, що зараз у шаблоні
# realty/web/templates/status.html (5/15/60 с); план Блоку 2, D48.
status_s = 5
blocks_s = 15
dedup_s = 60
# Нові панелі блоків (/api/status/speed, …/liveness тощо) — раз на 60 с
# (інтеграція, конфлікт «/status»): вони читають готовий рядок *_runs.
panels_s = 60
# Пауза у фоновій вкладці: зараз /api/status коштує ~0,35 с процесора на
# Fedora кожні 5 с, навіть коли вкладку ніхто не бачить (замір плану Блоку 2, D48).
pause_hidden = true

[timings]
# Журнал часу запитів в ops.db (Server-Timing): пакетний запис раз на 60 с —
# план Блоку 2, D48.
enabled = true
flush_s = 60
# Розрахунок: /api/status опитується кожні status_s = 5 с, у журнал іде кожне
# 12-те → 12 × 5 с = 60 с, раз на хвилину (план Блоку 2, D48).
sample_polls = 12
# Скільки днів зберігати — план Блоку 2, D48.
retention_days = 14
# Як часто фоновий запис прибирає рядки, старші за retention_days (журнал часу
# й маячок): раз на добу — план Блоку 2, D48 («очищення раз на добу»).
cleanup_every_h = 24
# Чиї запити писати в журнал часу (owner / friend). Чи писати друга — ПИТАННЯ
# ВЛАСНИКУ, ще без відповіді (план Блоку 2, відкрите питання 3; D49 «Чекає
# рішення власника»). Поки — обидві ролі, як для маячка: лише роль, без IP і
# рядка браузера. Прибрати "friend" тут і в [rum] roles — і друга не пишемо.
roles = ["owner", "friend"]

[rum]
# Маячок часу переходу з браузера: ціль власника (D46 п. 6) видно лише в
# браузері телефона — план Блоку 2, D48.
enabled = true
# Записувати переходи обох ролей (без IP і повного User-Agent) — план Блоку 2, D48.
# Для друга — ПИТАННЯ ВЛАСНИКУ, ще без відповіді (див. [timings] roles, D49).
roles = ["owner", "friend"]
# Скільки днів зберігати — план Блоку 2, D48.
retention_days = 30
# Найбільше тіло маячка, байтів: сам маячок ~0,5 КБ із 20 записами кнопок;
# більше — відмова 413, щоб ніхто не забив пам'ять сайту (розрахунок, D49).
max_body_bytes = 8192
# Скільки звернень кнопок (fetch до /api/…) брати з однієї сторінки — план
# Блоку 2, D48 («p95 кнопок за resource timing»); 20 — розрахунок D49: на
# сторінці квартири кнопок до ~10, з запасом удвічі.
max_resources = 20
# Скільки маячків на хвилину від однієї ролі записувати; решта приймається
# (204), але не пишеться й рахується (`over_limit` у зведенні). Розрахунок,
# D49: людина відкриває щонайбільше сторінку на ~2 с → 30 за хвилину. Без
# ліміту одна сесія (вкрадена кука, сторінка в циклі) писала б сотні рядків
# на секунду на 30 днів (замір на M4 — 387 маячків/с).
max_per_min = 30

[probe]
# Куди ходить зонд: сайт слухає лише 127.0.0.1:8000
# (deploy/fedora/systemd/realty-web.service). Інших адрес зонд не приймає —
# пароль власника не має йти нікуди, крім цієї машини (D49).
base_url = "http://127.0.0.1:8000"
# Що міряє `cli.py speed probe`. {big} — квартира з найбільшою кількістю
# оголошень; {random} і {single} — вибираються за фіксованим seed (план Блоку 2, D48).
# Сторінки квартир зонд у роботі ПРОПУСКАЄ: їх відкриття рахується як перегляд
# (черга перевірок) і без verify=0 запускає перевірку на сайтах джерел, а
# режиму «не рахувати» в сайту немає (D49). Час сторінок квартир — з журналу
# часу справжніх відкриттів (/api/status/speed).
urls = [
  "/", "/?page=2", "/?rooms=2", "/?sort=date_desc", "/processing",
  "/analytics", "/analytics?rooms=2",
  "/property/{big}", "/property/{random}", "/property/{single}",
  "/status", "/api/status",
]
# Навантаження зонда: 12 адрес × 20 повторів = 240 запитів, пауза 2,5 с після
# кожного → лише паузи 240 × 2,5 с = 10 хв, разом із часом запитів — ≥10 хв на
# фазу (у плані Блоку 2 було «~8 хв» — арифметична помилка плану, D48).
# Числа repeats, pause_s, timeout_s — план Блоку 2, D48; чому коротко, рідко й
# одним процесом — D45, інцидент 2 (заміри Етапу 0 самі навантажили сервер).
repeats = 20
pause_s = 2.5
timeout_s = 30
# Фази «цикл» і «дублі» чекають, поки цикл дійде до потрібного кроку (за
# серцебиттям диригента): не довше за 3 год — це інтервал між циклами
# (realty-cycle.timer), далі чекати немає сенсу (розрахунок, D49). Як часто
# дивитись — раз на 10 с: один рядок ops.db, крок триває хвилини (D49).
phase_wait_max_min = 180
phase_poll_s = 10

[summary]
# Зведення «Швидкість» (/api/status/speed, `cli.py speed report`): час сервера —
# за 24 год (спокій і цикл окремо), маячок — за 7 днів, останні 20 переходів
# (план Блоку 2, D48).
server_window_h = 24
rum_window_days = 7
recent = 20
# Скільки найновіших рядків кожного журналу читати для зведення. Замір D49
# (M4): по 300 тис. рядків маячка й журналу часу зведення без стелі читало
# 2,4–2,7 с і брало +710 МБ пам'яті; зі стелею 20 000 — 76–82 мс і +21 МБ
# (лише в такому переповненому журналі). Справжній обсяг двох людей — до ~1,5
# тис. запитів на добу й ~6 тис. переходів за 7 днів, тож стеля спрацьовує
# лише в потопі; тоді зведення позначає `truncated`.
max_rows = 20000

[txn_watch]
# Диригент передає TXN_WATCH=1 крокам циклу; вони пишуть найдовше вікно
# транзакції запису в ops.db — щоб лікувати блокування за виміром, а не наосліп
# (план Блоку 2, D48).
enabled = true
