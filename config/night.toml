# Нічний диригент — `cli.py night`, крок E9 (D53).
#
# Схема — realty/configfiles.py (NightConfig). Значень за замовчуванням у коді
# немає: кожен ключ обов'язковий (`cli.py config check`).
#
# Один процес на одному таймері (realty-night.timer, 01:10 і 04:10) замість
# realty-identity.timer: дозбір identity — одна з робіт реєстру (інтеграція,
# конфлікт 3, D47). Під тим самим замком, що й цикл (runner.CycleLock): цикл ніколи
# не йде одночасно з нічними роботами, а `run_cycle` бере замок без очікування —
# тож замок звільняється щонайменше за 10 хв до циклів о 03:05 і 06:05.
#
# Темп кожного хоста — НЕ тут: config/liveness.toml, нічна смуга бере
# max(hosts.*.delay, SOURCES[pace_source].full_delay) (інтеграція, конфлікт 4):
# dom.ria.com 1,0 с, olx.ua 2,8 с, rieltor.ua 3,0 с, lun.ua 1,6 с, flombu.com 1,2 с.
# Запобіжник — config/liveness.toml [fuse]; уночі «прогін» — пакет смуг (нижче).
#
# Походження чисел: «інтеграція, D47» — інтеграційний план промту 11 (його числа
# переписано в журнал у D53, бо сам план лежить поза git); «розрахунок, D53».

# Вікна — місцевий час машини (Fedora: Europe/Kyiv, як і OnCalendar таймерів).
# start — коли стартує таймер; stop_requests — після цього смуги не видають
# нових запитів; release_lock — замок циклу звільнено до цього часу. 02:55 і
# 05:55 — ≥10 хв до циклів 03:05 і 06:05 (таймер циклу ще додає до 120 с
# випадкової затримки); 8 хв між stop_requests і release_lock — запити, що вже в
# дорозі (REQUEST_TIMEOUT 45 с), останній пакет і звіт (інтеграція, D47).
[[windows]]
start = "01:10"
stop_requests = "02:47"
release_lock = "02:55"

[[windows]]
start = "04:10"
stop_requests = "05:47"
release_lock = "05:55"

[lock]
# Цикл о 00:05 і 03:05 триває ~40–60 хв і може накластись на початок вікна:
# диригент чекає замка, перевіряючи раз на стільки секунд, і не стартує, якщо до
# stop_requests лишилось менше за min_work_minutes (як і досі дозбір identity:
# LOCK_POLL 60 с, MIN_WORK 10 хв; інтеграція, D47).
poll_seconds = 60
min_work_minutes = 10

[backup]
# Ніч починається зі свіжого перевіреного бекапу, якщо останній успішний старший
# за стільки годин (інтеграція, D47: «старша за 20 год» — те саме число, що й
# BACKUP_EVERY_HOURS для таймера 04:30 і кроку циклу «бекап»). Бекап не вдався — у
# цьому вікні нічого не пишемо, смуги не стартують, тривога в Telegram (сторож);
# наступне вікно пробує знову (рецензія E9, D53).
max_age_hours = 20
# Вікно з одноразовими роботами (у плані є ключі M2 — legacy_404, onetime_reseen —
# чи M3 — onetime_hinted, onetime_blind: тисячі повернень і знять) — бекап, якщо
# останній успішний старший за стільки годин. Бекапи лягають у кінці циклів раз на
# ~21 год, і крок циклу «бекап» о ~00:55 і ~03:50 — за 15–20 хв до вікон: за самим
# правилом 20 год ніч майже ніколи б не бекапилась, і перші ночі M2/M3 писали б на
# бекапі до 20-годинної давності (рецензія E9, D53; рішення власника 2, D46:
# «повернути зі свіжим бекапом»). 3 год: бекап кроку циклу 00:55 перед вікном 01:10
# ще свіжий, а ніч із M2/M3, перед якою бекапу не було, бекапиться сама. Сталі вікна
# (контрольні, вибірка знятих, догін) — за правилом max_age_hours.
onetime_max_age_hours = 3
# Стеля бекапу на старті ночі — як у кроку циклу «бекап» (runner.TASK_TIMEOUTS:
# 15 хв; на HDD Fedora ~5–10 хв, база ~120 МБ; інтеграція, D47).
timeout_minutes = 15

[lanes]
# Результати смуг застосовуються пакетами раз на стільки хвилин: запобіжник
# оцінює пакет як «прогін» (частка — лише при n ≥ fuse.min_checked джерела, менші
# пули — разом із вікном fuse.window_hours), потім запис ≤ run.apply_batch_rows
# рядків на транзакцію; убитий за дедлайном процес нічого не губить
# (інтеграція, конфлікт 7, D47: «пакет ≈15 хв»).
batch_minutes = 15
# Як часто диригент дивиться на смуги й час, с (розрахунок, D53: дрібно проти
# 15-хв пакета, дешево — лише stat файлів результатів).
poll_seconds = 5
# Після stop_requests диригент чекає стільки секунд, поки смуги допишуть запити,
# що вже в дорозі (REQUEST_TIMEOUT 45 с + запас), і лише потім зупиняє процеси
# примусово (розрахунок, D53).
kill_grace_seconds = 60
# Смуга стоїть до кінця ночі (і тривога), якщо 401/403/429 — понад стільки від
# її запитів після block_min_requests (інтеграція, D47: «блокувань понад 10% у
# вікні»), або run.max_consecutive_blocks поспіль (config/liveness.toml, 5).
# Повторилось наступної ночі — хост чекає рішення власника (`cli.py night unhold`).
block_share = 0.10
block_min_requests = 20

[jobs]
# Порядок робіт усередині смуги хоста (інтеграція, D47: Блок 1 — M2 → M3
# підказані → M3 сліпі — понад дозбір). canary — першою (контрольні в першому
# пакеті ночі), identity — останньою (схема це перевіряє):
#   canary          — контрольні «відомо живі» (liveness hosts.*.canaries_per_run);
#   held            — вердикт, не застосований через запобіжник («знято» актуальному
#                     чи «живе» знятому рядку), щойно джерело й сайт відпущено;
#   legacy_404      — M2: зняті старим кодом за одним 404 — повертаються лише ті,
#                     кого жива перевірка новим підписом покаже живими;
#   onetime_reseen  — M2: зняті, але знову бачені в стрічці (усі 2 982 на копії,
#                     з них 2 375 — артефакт D43; повертаємо лише живих, D47);
#   onetime_hinted  — M3: актуальні ключі без жодної відповіді новим підписом,
#                     зниклі з повного переліку (absent_since);
#   onetime_blind   — M3: решта таких ключів, випадково із зерном onetime_seed;
#   rm_sample       — вибірка знятих (живі повертаються з подією «повернулось»);
#   overdue         — догін, лише якщо прострочених ключів хоста понад
#                     alerts.coverage_overdue_share (10%);
#   identity        — дозбір ознак квартири (колишній realty-identity.timer).
# Прибрати роботу з переліку — вимкнути її.
order = ["canary", "held", "legacy_404", "onetime_reseen", "onetime_hinted", "onetime_blind", "rm_sample", "overdue", "identity"]
# Контрольні («відомо живі») — не лише на початку вікна: стільки на хост у кожному
# наступному 15-хвилинному пакеті (перший пакет — повна порція liveness
# hosts.*.canaries_per_run). Власник 08.10 (D55, D56): контрольні ловлять банер на
# живих одразу, без статистики, — у кожному прогоні, а вночі прогін — пакет. По
# одному: «знято» на контрольному тримає джерело з першого разу, а кожен зайвий
# контрольний — ще й шанс хибної зупинки на справді щойно знятому (OLX ~0,07%/год).
canaries_per_batch = 1
# Зерно випадкового порядку M3 (той самий порядок щоночі: ключі, до яких черга не
# дійшла, ідуть наступного вікна першими; план Блоку 1 — «випадково із зерном», D52).
onetime_seed = 20261008
# Вибірка знятих за вікно, ключів на хост — та сама порція, що й у кроці циклу
# (liveness hosts.*.removed_sample_per_run; план Блоку 1, D52): +2 вибірки на добу.
# Не більше: у literal-режимі запобіжника вибірка знятих рахується в частці, а за
# побудовою вона здебільшого «знято» — пакет, у якому лише вона (сталий режим ночі,
# M2/M3 позаду), сам набрав би fuse.min_checked і тримав би джерело щоночі (доказ
# D53: OLX 40 ключів → «знято» 19 із 50). Порція циклу < min_checked — такий пакет
# рахується разом із перевірками за fuse.window_hours, як малий прогін.
rm_sample_per_host = { "dom.ria.com" = 3, "olx.ua" = 10, "rieltor.ua" = 5, "lun.ua" = 1, "flombu.com" = 1 }
# Дозбір identity — у смузі хоста свого джерела, після перевірок актуальності цієї
# смуги: один потік запитів на сайт (інтеграція, конфлікт 3). Джерела — ті самі, що
# брав realty-identity.service (identity backfill: domria, lun, flombu). Картки
# DOM.RIA — з паузою й блокуваннями смуги; прохід стрічки LUN/flombu — лише стрічка
# (`scrape --no-detail`: сторінки деталей LUN — це rieltor.ua, olx.ua, dom.ria.com, куди
# вночі ходять лише їхні смуги) і не швидше за нічний темп хоста (`--min-delay`;
# рецензія E9, D53). Прохід стрічки — звичайний збір (нові оголошення, події ціни):
# звіт ночі звіряє «актуальних після» з тим, що він дописав.
identity_sources = { "dom.ria.com" = "domria", "lun.ua" = "lun", "flombu.com" = "flombu" }

[report]
# Строк продажу (Каплан—Меєр) до і після нічних повернень і знять — у запис ночі й
# `cli.py liveness report` (рішення власника 2, D46: «показати, як зміниться
# оцінка»). Два прорахунки за вікно, поза замком циклу.
liquidity = true
# Типовий час одного запиту, с — для `night --dry-run`, доки немає заміру минулої
# ночі (тоді — її check_seconds / requests). Темп смуги — старт-до-старту, тож крок
# = max(темп, відповідь): GET DOM.RIA ≈ 1,4 с (інтеграція, D47), решта — у межах
# темпу (HEAD). Хост, якого тут немає, — його темп (рецензія E9, D53).
typical_request_seconds = { "dom.ria.com" = 1.4 }
