# Стелі НОВИХ кроків циклу (інтеграція, конфлікт 11: «нові стелі — у config/cycle.toml»).
# Старі кроки — як і досі, runner.TASK_TIMEOUTS. Читає диригент циклу на старті.

[places]
# Крок «райони й ЖК» (`cli.py places assign`, E10, D57): 0 запитів до джерел — розбір,
# порівняння з довідником, запис лише порожніх ключів. План Блоку 4: «≤60 с на Fedora
# при повному проході 29 тисяч»; стеля з запасом ×10 — як у плані (rules.step.timeout_min).
timeout_min = 10
# Крок у циклі — лише після перегляду вибірки власником (рецензія E10, D57): DEPLOY.md —
# `places sample` → СТОП: перегляд → ручний `places assign` → тут true. Ключі пишуться
# «лише туди, де порожньо», тож хибні потім виправляє лише `places reassign --apply`.
enabled = false
