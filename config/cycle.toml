# Стелі НОВИХ кроків циклу (інтеграція, конфлікт 11: «нові стелі — у config/cycle.toml»).
# Старі кроки — як і досі, runner.TASK_TIMEOUTS. Читає диригент циклу на старті.

[places]
# Крок «райони й ЖК» (`cli.py places assign`, E10, D57): 0 запитів до джерел — розбір,
# порівняння з довідником, запис лише порожніх ключів. План Блоку 4: «≤60 с на Fedora
# при повному проході 29 тисяч»; стеля з запасом ×10 — як у плані (rules.step.timeout_min).
timeout_min = 10
# Рецензія E10 радила вмикати крок лише після перегляду вибірки власником (D57).
# Рішення власника 08.10 — варіант (а): вмикати одразу з розгортанням (точність за
# іншими оголошеннями того ж будинку: DIM.RIA 94,5%, LUN 93% при порозі 90%), 10
# складних випадків — на чекпойнті 11.10. Ключі пишуться «лише туди, де порожньо»,
# хибні потім виправляє лише `places reassign --apply` (зі свіжим бекапом).
enabled = true
